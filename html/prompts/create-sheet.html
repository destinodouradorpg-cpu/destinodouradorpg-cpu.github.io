<div id="create-sheet-prompt" class="prompt-container">
    <div class="prompt">
        <span class="font-size-title-s">Criar Nova Ficha?</span>
        
        <input 
            id="sheet-name-field"
            class="font-size-text-s font-default" 
            type="text" 
            placeholder="Nome"
        >

        <div class="button-holder title-lines">
            <button
                id="dont-create-sheet-button"
                class="font-default font-size-text alt-color"
            >Cancelar</button>
            <button
                id="create-sheet-button"
                class="font-default font-size-text"
            >Criar</button>
        </div>
    </div>
</div>
