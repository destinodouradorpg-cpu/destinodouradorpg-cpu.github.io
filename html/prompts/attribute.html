<div id="attribute-prompt" class="prompt-container" attribute-key="">
    <div class="prompt">
        <span id="attribute-name" class="font-size-title-s"></span>
        <div class="button-holder text-lines">
            <button
            id="attribute-prompt-sub"
            class="font-size-text alt-color"
            >-</button>
            <span id="attribute-value">0/5</span>
            <button
            id="attribute-prompt-add"
            class="font-size-text"
            >+</button>
        </div>
        <button
            id="attribute-prompt-close"
            class="font-default font-size-text alt-color"
        >Fechar</button>
    </div>
</div>
