<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <title>Destino Dourado RPG</title>
    <link rel="icon" href="/assets/icon.webp">
    <link rel="stylesheet" href="index.css">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:title" content="Destino Dourado RPG - Fichas">
    <meta property="og:description" content="'Sheets' e não 'Shits'">
</head>

<body class="font-size-text old-standard-tt-regular">
    
    <div class="inner-column opaque-background">
        <h1 id="main-title" class="font-size-title title title-lines">Ficha</h1>
    
        <!--GENERAL-->
        <div class="category">
            <h2 class="text-lines">Geral</h2>

            <div id="general-container">
                <input 
                id="name-field"
                type="text"
                class="alt-color font-size-text old-standard-tt-regular" 
                placeholder="Nome"
                sheet-path="name"
                >

                <input id="player-field"
                type="text"
                class="alt-color font-size-text old-standard-tt-regular" 
                placeholder="Jogador"
                sheet-path="player"
                >

                <div id="sheet-image-container">
                    <img id="sheet-image" sheet-path="image" src="" alt="Imagem Do Personagem">
                    <input
                     type="file"
                     id="sheet-image-input"
                     accept="image/*"
                     style="display: none;"
                    >
                </div>

                <lnumber-input
                 name="Nível"
                 id="sheet-level-field"
                 sheet-path="level"
                 max="50"
                 style="align-content: center;"
                 sheet-path="level"
                ></lnumber-input>

                <span style="align-self: center;"
                >Movimentação: <span id="movement-value">0m</span></span>
                
                <label for="race">Raça:</label>
                <select
                 id="race-selector"
                 name="race"
                 class="old-standard-tt-regular font-size-text"
                 sheet-path="race"
                >
                    <option>Humano</option><option>Elfo</option>
                    <option>Anão</option><option>Hobbit</option>
                    <option>Fada</option><option>Gigante</option>
                    <option>Ruído</option><option>Goblin</option>
                    <option>Orc</option><option>Troll</option>
                    <option>Canydal</option><option>Felicato</option>
                    <option>Rhoedrus</option><option>Komodo</option>
                    <option>Anfiburus</option><option>Megafauno</option>
                    <option>Ungulario</option><option>Insectoide</option>
                    <option>Avipino</option><option>Sirenico</option>
                    <option>Slime</option><option>Golenideo</option>
                    <option>Arboreo</option><option>Automato</option>
                    <option>Esqueleto</option><option>Zumbi</option>
                    <option>Vampiro</option><option>Anjelis</option>
                    <option>Diabrante</option><option>Simiosapien</option>
                </select>

                <label for="class">Classe:</label>
                <div style="grid-column: 2/4; display: flex; flex-wrap: wrap; gap: 8px">
                    <select
                     id="class-selector"
                     name="class"
                     class="old-standard-tt-regular font-size-text"
                     sheet-path="class"
                     style="width: 100%; justify-self: left;"
                    >
                        <option>Alquimista</option><option>Artista</option>
                        <option>Bárbaro</option><option>Domador</option>
                        <option>Druída</option><option>Feiticeiro</option>
                        <option>Fera</option><option>Flecheiro</option>
                        <option>Guardião</option><option>Guerreiro</option>
                        <option>Inventor</option><option>Ladino</option>
                        <option>Mago</option><option>Mosqueteiro</option>
                        <option>Pistoleiro</option><option>Prospector</option>
                        <option>Pugilista</option><option>Ritualista</option>
                        <option>Sacerdote</option><option>Vigarista</option>
                    </select>

                    <label style="height: auto;">
                        <input type="checkbox">
                        Mundano
                    </label>
                </div>

                <div class="cell main-attribute-container">
                    <span class="text-lines">PV</span>
                    <span id="hp-value" class="font-size-title-s">0</span>
                    
                    <lnumber-input name="Base" sheet-path="hp_base"></lnumber-input>
                    <span id="armor-sp">Armad.: <span>0</span></span>
                    <lnumber-input name="Nível"></lnumber-input>
                    <lnumber-input name="Bônus" sheet-path="hp_bonus" min="-99"></lnumber-input>
                </div>
                <div class="cell main-attribute-container">
                    <span class="text-lines">PE</span>
                    <span id="mp-value" class="font-size-title-s">0</span>

                    <lnumber-input name="Base" sheet-path="mp_base"></lnumber-input>
                    <span id="armor-sp">Armad.: <span>0</span></span>
                    <lnumber-input name="Nível"></lnumber-input>
                    <lnumber-input name="Bônus" sheet-path="mp_bonus" min="-99"></lnumber-input>
                </div>
                <div class="cell main-attribute-container">
                    <span class="text-lines">PS</span>
                    <span id="sp-value" class="font-size-title-s">0</span>
                    <lnumber-input  name="Bônus" sheet-path="sp_bonus" min="-99"></lnumber-input>
                </div>
            </div>
        </div>

        <!--ATTRIBUTES-->
        <div class="category">
            <h2 class="text-lines">Atributos</h2>
            <div id="attribute-container">
                <sheet-attribute type="strength" name="Força"></sheet-attribute>
                <sheet-attribute type="agility" name="Agilidade"></sheet-attribute>
                <sheet-attribute type="resistance" name="Resistência"></sheet-attribute>
                <sheet-attribute type="stealth" name="Sutileza"></sheet-attribute>
                <sheet-attribute type="luck" name="Sorte"></sheet-attribute>
                <sheet-attribute type="charisma" name="Carisma"></sheet-attribute>
                <sheet-attribute type="inteligence" name="Inteligência"></sheet-attribute>
                <sheet-attribute type="mind" name="Mente"></sheet-attribute>
            </div>
        </div>

        <!--CHARACTERISTICS-->
        <div class="category">
            <h2 class="text-lines">Características</h2>
            <div style="display: flex; gap: 8px">
                <div style="width: 100%">
                    <h3 style="
                        margin-top: 0;
                        border-bottom: 1px dashed var(--GeneralTextColor);
                        " class="text-lines"
                    >Raça</h3>
                    <div style="display: flex; flex-direction: column;">
                        <h4 style="margin-top: 0;" class="text-lines">Beneficios</h4>
                        <p id="race-strength" style="margin-top: 0;">---</p>
                        <h4 style="margin-top: 0;" class="text-lines">Fraquezas</h4>
                        <p id="race-weakness" style="margin-top: 0;">---</p>
                    </div>
                </div>
                <div style="height: auto; border: 1px dashed var(--GeneralTextColor);"></div>
                <div style="width: 100%">
                    <h3 style="
                        margin-top: 0;
                        border-bottom: 1px dashed var(--GeneralTextColor);
                        " class="text-lines"
                    >Conhecimentos</h3>
                    <div style="display: flex; flex-direction: column;">
                        <span>· De Classe: <span>---</span></span>
                        <div id="knowlage-container">

                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!--SKILLS-->
        <div class="category">
            <h2 class="text-lines">Habilidades</h2>
            <div id="skill-container">
                <sheet-skill idx="1"></sheet-skill>
                <sheet-skill idx="2"></sheet-skill>
                <sheet-skill idx="3"></sheet-skill>
                <sheet-skill idx="4"></sheet-skill>
                <sheet-skill idx="5"></sheet-skill>
                <sheet-skill idx="6"></sheet-skill>
                <sheet-skill idx="7"></sheet-skill>
                <sheet-skill idx="8"></sheet-skill>
                <sheet-skill idx="9"></sheet-skill>
                <sheet-skill idx="10"></sheet-skill>
                <sheet-skill idx="11"></sheet-skill>
                <sheet-skill idx="12"></sheet-skill>
            </div>
        </div>
    </div>
    <script type="module" src="index.js"></script>
</body>
</html>
